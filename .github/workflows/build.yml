name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      dockerfile_path:
        description: 'Path to the Dockerfile (e.g., Dockerfile.whisperx)'
        required: true
        default: 'Dockerfile'
        type: string
      image_name:
        description: 'Name of the image (e.g., whisperx)'
        required: true
        default: 'my-app'
        type: string
      version_tag:
        description: 'Version tag for the image (e.g., v1.0.0)'
        required: true
        default: 'latest'
        type: string
      context_path:
        description: 'Build context path (default: .)'
        required: false
        default: '.'
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.event.inputs.context_path }}
          file: ${{ github.event.inputs.dockerfile_path }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.inputs.image_name }}:${{ github.event.inputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
